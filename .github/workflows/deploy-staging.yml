name: Deploy staging

on:
  workflow_run:
    workflows: [CI/CD Pipeline]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  UPSUN_PROJECT: tkizmoe6el7jw
  UPSUN_CLI_VERSION: 5.19.0

jobs:
  deploy:
    name: Push to Upsun staging
    # workflow_run also fires for pull_request runs whose head branch is named main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Upsun refuses a push from a shallow clone.
          fetch-depth: 0

      - name: Install the Upsun CLI
        run: |
          curl -fsSL "https://raw.githubusercontent.com/upsun/cli/v${UPSUN_CLI_VERSION}/installer.sh" \
            | VERSION="$UPSUN_CLI_VERSION" INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push to staging
        env:
          UPSUN_CLI_TOKEN: ${{ secrets.UPSUN_CLI_TOKEN }}
          UPSUN_CLI_NO_INTERACTION: '1'
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # CI runs of main can finish out of order: a newer commit may already be on staging.
        run: |
          staging_head="$(upsun environment:info head_commit --environment staging --project "$UPSUN_PROJECT")"
          set +e
          git merge-base --is-ancestor "$HEAD_SHA" "$staging_head"
          contained=$?
          set -e
          case "$contained" in
            0)
              echo "::notice::Staging runs $staging_head, which contains $HEAD_SHA: nothing to push."
              exit 0
              ;;
            1) ;;
            *)
              echo "::error::Cannot compare $HEAD_SHA with the staging commit $staging_head."
              exit 1
              ;;
          esac
          upsun push "$HEAD_SHA" --target staging --project "$UPSUN_PROJECT" --wait
