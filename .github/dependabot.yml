version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"

updates:
  - package-ecosystem: "npm"
    directory: "/upsun-mcp"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
    ignore:
      # ts-jest 29 requires typescript <7.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
